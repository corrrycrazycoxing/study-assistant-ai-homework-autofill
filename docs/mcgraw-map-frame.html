<!doctype html><html><head><meta charset="utf-8"><style>body{font:15px system-ui;background:white;padding:15px}td,th{border:1px solid #aaa;padding:8px;min-width:85px}table{border-collapse:collapse;width:100%}input[type=button]{padding:8px;margin:5px}.active{outline:2px solid #117ead}.list_content{cursor:pointer}#listbox-id{background:#eef;list-style:none;padding:10px;width:240px}li{padding:4px}</style></head><body class="test-mode">
<div class="control_buttons"><input role="tab" ref="1" value="A" type="button" class="active"><input role="tab" ref="2" value="B" type="button"><input role="tab" ref="3" value="C" type="button"></div><ul id="transactionCarousel"><li ref="1">Record the increase in cash.</li><li ref="2">Record the decrease in cash.</li><li ref="3">Record another bank fee.</li></ul><table id="worksheet-layout"><tbody><tr><td><div id="jQuerySheet"><table id="jSheet_0_0"><thead><tr><th>Transaction</th><th>General Journal</th><th>Debit</th><th>Credit</th></tr></thead><tbody></tbody></table><textarea id="jSheetControls_formula_0" title="Sheet input"></textarea></div></td></tr></tbody></table><input class="dropdownButton" title="Show All Items" type="button" value="Accounts"><ul id="listbox-id" role="listbox" hidden></ul><input id="saveTransation" type="button" value="Record entry"><input id="doneTransaction" type="button" value="View general journal"><pre id="model-result"></pre>
<script>
// Synthetic editor contract. No real assignment or vendor scoring/config data.
const body=document.querySelector('#jSheet_0_0 tbody'),states={1:Array.from({length:6},()=>({account:'',debit:'',credit:''})),2:Array.from({length:7},()=>({account:'',debit:'',credit:''})),3:Array.from({length:8},()=>({account:'',debit:'',credit:''}))},saved={},counts={commits:0,records:0,activations:0};let ref='1',formula='';const pendingCells=new Map();
function render(){body.innerHTML='';for(let r=0;r<states[ref].length;r++){const tr=body.insertRow();tr.insertCell().textContent=r? '':ref;['account','debit','credit'].forEach((name,i)=>{const td=tr.insertCell();td.id='0_table0_cell_c'+(i+1)+'_r'+r;td.className='responseCell '+(name==='account'?'dropDownList':'isN');td.setAttribute('aria-label',name==='account'?'General Journal':'__'+name+'__');td.textContent=states[ref][r][name];});}update();}
function update(){document.getElementById('model-result').textContent=JSON.stringify({states,saved,counts});}
const wrap=e=>({0:e,length:e?1:0});
const js={i:0,cellLast:{},obj:{sheet:()=>wrap(document.getElementById('jSheet_0_0')),formula:()=>({val(v){if(arguments.length){formula=v;document.getElementById('jSheetControls_formula_0').value=v;}return formula;}}),inPlaceEdit:()=>({length:0})},getTdLocation:e=>{const m=e[0].id.match(/c(\d+)_r(\d+)/);return [+m[2],+m[1]];},cellEdit(e){this.cellLast={td:e};counts.activations++;},tableCellProviders:[{getCell(s,r,c){return {get value(){const name=['transaction','account','debit','credit'][c-1],p=pendingCells.get(ref+'|'+(r-1)+'|'+name);return p&&Date.now()<p.until?p.before:states[ref][r-1][name];}}}}],evt:{cellEditDone(){if(!js.cellLast.isEdit)throw Error('not editing');const td=js.cellLast.td[0],m=td.id.match(/c(\d+)_r(\d+)/),name=['transaction','account','debit','credit'][+m[1]];if(ref==='2')pendingCells.set(ref+'|'+m[2]+'|'+name,{before:states[ref][+m[2]][name],until:Date.now()+600});states[ref][+m[2]][name]=formula;td.textContent=formula;js.cellLast.isEdit=false;counts.commits++;update();}}};
window.jQuery=e=>wrap(e);jQuery.sheet={instance:[js]};
document.querySelector('.dropdownButton').onclick=()=>{const list=document.getElementById('listbox-id');list.hidden=!list.hidden;list.innerHTML='';for(const account of ['','No Journal Entry Required','Cash','Notes Receivable','Interest Revenue','Service Fee Expense']){const li=document.createElement('li');li.setAttribute('role','option');const a=document.createElement('a');a.className='list_content';a.textContent=account;li.append(a);li.onclick=()=>{const td=js.cellLast.td[0],r=+td.id.match(/r(\d+)/)[1];td.textContent=account;states[ref][r].account=account;list.hidden=true;counts.commits++;update();};list.append(li);}};
for(const tab of document.querySelectorAll('.control_buttons input'))tab.onclick=()=>{document.querySelector('.active').classList.remove('active');tab.classList.add('active');ref=tab.getAttribute('ref');setTimeout(render,150);};
document.getElementById('saveTransation').onclick=()=>{saved[ref]=structuredClone(states[ref]);counts.records++;document.querySelector('.active').classList.add('graded');update();};
window.fixtureRecorded=refs=>{for(const r of refs){saved[r]=structuredClone(states[r]);document.querySelector('input[ref="'+r+'"]').classList.add('graded');}update();};window.fixtureSeed=(r,data)=>{states[r]=data;render();};render();
</script><script src="../content-scripts/mcgraw-accounting-bridge.js"></script></body></html>
