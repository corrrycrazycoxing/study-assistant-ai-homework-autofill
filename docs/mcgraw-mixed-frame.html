<!doctype html><html><head><meta charset="utf-8"><style>body{font:15px system-ui;padding:15px}table{border-collapse:collapse}td{border:1px solid #999;padding:9px;min-width:130px}td.responseCell{border:2px solid #4793d7}td.dropDownList{min-width:240px}.listContainer{background:white;border:1px solid #888;position:fixed;top:40px;left:20px;padding:8px;z-index:10}li{cursor:pointer;padding:5px}textarea{position:absolute;left:-9999px}[hidden]{display:none!important}</style></head><body class="test-mode accountingtool_baseaccountingtool"><div id="jQuerySheet"><table class="jSheet" id="jSheet_0_0"><caption>Table has two columns. Account names can be selected in column 1 from rows 1 to 5. Values can be entered in column 2. Total cost of the bread machine can be entered in row 6.</caption><tbody></tbody></table><textarea id="jSheetControls_formula_0"></textarea></div><div class="listContainer" hidden><ul id="listbox-id" role="listbox"></ul></div><input class="dropdownButton" type="button" value="Show All Items" hidden><pre id="model-result"></pre><script>
const choices=['Purchase price','Freight','Installation','Testing','Property tax'],states={1:Array.from({length:6},()=>({account:'',amount:''}))},saved={},counts={commits:0,records:0,activations:0};let formula='';
const table=document.getElementById('jSheet_0_0'),body=table.tBodies[0],button=document.querySelector('.dropdownButton'),list=document.querySelector('.listContainer'),wrap=e=>({0:e,length:e?1:0});
for(let r=0;r<6;r++){const row=body.insertRow();for(let c=0;c<2;c++){const td=row.insertCell();td.id=`0_table0_cell_c${c}_r${r}`;td.className=r===5&&c===0?'td-readOnly':`responseCell ${c===0?'dropDownList shuffled groupResponse rowHeader':'isN'}`;td.textContent=r===5&&c===0?'Total cost of the bread machine':'';td.setAttribute('aria-label',r===5?'Total cost of the bread machine':' ');if(c===1)td.setAttribute('headers',`0_table0_cell_c0_r${r}`);}}
const calculated=body.insertRow();calculated.insertCell().textContent='Calculated cross-check';const total=calculated.insertCell();total.className='td-readOnly';total.setAttribute('formula','=SUM(B1:B5)');
function update(){total.textContent=String(states[1].slice(0,5).reduce((sum,row)=>sum+Number(row.amount||0),0));document.getElementById('model-result').textContent=JSON.stringify({states,saved,counts,total:total.textContent});}
const js={i:0,cellLast:{},obj:{sheet:()=>wrap(table),formula:()=>({val(value){if(arguments.length){formula=value;document.getElementById('jSheetControls_formula_0').value=value;}return formula;}}),inPlaceEdit:()=>({length:0})},getTdLocation:e=>[e[0].parentElement.rowIndex,e[0].cellIndex],cellEdit(e){this.cellLast={td:e};counts.activations++;button.hidden=!e[0].classList.contains('dropDownList');list.hidden=true;},tableCellProviders:[{getCell(sheet,row,col){return {value:states[1][row-1][col===1?'account':'amount']};}}],evt:{cellEditDone(){if(!js.cellLast.isEdit)throw Error('not editing');const td=js.cellLast.td[0],r=td.parentElement.rowIndex;states[1][r].amount=formula;td.textContent=formula;js.cellLast.isEdit=false;counts.commits++;saved[1]=structuredClone(states[1]);update();}}};
button.onclick=()=>{if(!list.hidden){list.hidden=true;return;}const ul=document.getElementById('listbox-id');ul.replaceChildren();for(const choice of choices){const li=document.createElement('li');li.setAttribute('role','option');const text=document.createElement('span');text.className='list_content';text.textContent=choice;li.append(text);li.onclick=()=>{const td=js.cellLast.td[0];td.textContent=choice;states[1][td.parentElement.rowIndex].account=choice;counts.commits++;saved[1]=structuredClone(states[1]);list.hidden=true;update();};ul.append(li);}list.hidden=false;};
window.jQuery=e=>wrap(e);jQuery.sheet={instance:[js]};window.fixtureSeed=values=>{values.forEach((value,r)=>{Object.assign(states[1][r],value);for(const [c,key] of [[0,'account'],[1,'amount']]){const cell=document.getElementById(`0_table0_cell_c${c}_r${r}`);if(cell.classList.contains('responseCell'))cell.textContent=value[key]||'';}});update();};update();
</script><script src="../content-scripts/mcgraw-accounting-bridge.js"></script></body></html>
